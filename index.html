function parseRt(s){const o=[];String(s||'').split(',').forEach(x=>{x=x.trim();const m=x.match(/^(\d+)\s*-\s*(\d+)$/);if(m){for(let k=+m[1];k<=Math.min(+m[2],+m[1]+200);k++)o.push(String(k))}else if(/^\d+$/.test(x))o.push(String(+x))});return o}
function rtOf(r){const p=String(r.wp||'').split(',').map(x=>x.trim()).find(x=>/^\d*\/\d*$/.test(x));let v=p?String(+p.split('/')[0]||''):'';if(!v){const o=String(r.op||'').split(',').map(x=>x.trim());v=String(+o[1]||'')}return v}
function pemIdx(r){let v=pmc.get(r.nop);if(v!==undefined)return v;const d=dsnName(r),rt=rtOf(r);v=-1;
 for(let i=0;i<S.pm.length;i++){const m=S.pm[i];if(!m.n)continue;const ks=kw(m.d);if(!ks.length||!ks.some(k=>d.includes(k)))continue;const rs=parseRt(m.rt);if(rs.length&&!rs.includes(rt))continue;v=i;break}
 pmc.set(r.nop,v);return v}
const pemOf=r=>{const i=pemIdx(r);return i<0?'':S.pm[i].n};
const pmWil=m=>{const d=kw(m.d).map(x=>x[0]+x.slice(1).toLowerCase()).join(', ');return(d||'-')+(parseRt(m.rt).length?' · RT '+m.rt:' · semua RT')};
const pemHp=n=>{const e=S.pm.find(x=>x.n===n&&x.hp);return e?e.hp:''};
const pemList=()=>[...new Set(S.pm.map(x=>x.n).filter(Boolean))].sort();
const dusuns=()=>[...new Set(VR().map(dsnName))].filter(Boolean).sort();
const btd=()=>S.bt||(S.tahun+'-08-31');
const nm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function groups(rows=S.rows){const m=new Map();rows.forEach(r=>{const k=nm(r.nama)+'|'+nm(r.wp);if(!m.has(k))m.set(k,[]);m.get(k).push(r)});return m}
function stat(){const R=VR(),tot=R.reduce((a,r)=>a+r.pokok,0),lun=R.filter(r=>r.lunas),real=lun.reduce((a,r)=>a+r.pokok,0),sr=R.filter(r=>r.serah).length;
 return{n:R.length,tot,nl:lun.length,real,sr,siap:lun.length-sr,pct:tot?Math.round(real/tot*100):0}}
function statPem(){const m=new Map();VR().forEach(r=>{const n=pemOf(r)||'';let x=m.get(n);if(!x){x={n,hp:pemHp(n),wil:n?S.pm.filter(y=>y.n===n).map(pmWil).join(' | '):'-',nop:0,pokok:0,real:0,serah:0};m.set(n,x)}x.nop++;x.pokok+=r.pokok;if(r.lunas)x.real+=r.pokok;if(r.serah)x.serah++});return[...m.values()].sort((a,b)=>(!a.n)-(!b.n)||a.n.localeCompare(b.n))}
function statDsn(){const m=new Map();VR().forEach(r=>{const d=dsnName(r)||'-';let x=m.get(d);if(!x){x={d,nop:0,pokok:0,real:0};m.set(d,x)}x.nop++;x.pokok+=r.pokok;if(r.lunas)x.real+=r.pokok});return[...m.values()].sort((a,b)=>a.d.localeCompare(b.d))}
function hdr(){$('#sub').textContent=(S.desa?'Desa '+S.desa+' · ':'')+'PBB-P2 '+S.tahun+(isP()?' · '+U.n:'');$('#pgv').textContent=stat().pct+'%'}

function rwOf(r){const q=String(r.wp||'').split(',').map(x=>x.trim()).find(x=>/^\d*\/\d*$/.test(x));return q?String(+q.split('/')[1]||''):''}
function dsnName(r){return String(r.wp||r.op||'').split(',')[0].trim().toUpperCase().replace(/^(DUSUN|DSN)\.?\s+/,'')}
function jadIdx(r){const d=dsnName(r),rw=rwOf(r);
 for(let i=0;i<S.jad.length;i++){const j=S.jad[i];const ks=(j.kw||'').toUpperCase().split(',').map(x=>x.trim()).filter(Boolean);const rs=(j.rw||'').split(',').map(x=>String(+x.trim()||'')).filter(Boolean);
  if(ks.some(k=>d.includes(k))||(rw&&rs.includes(rw)))return i}return 999}
const jadOf=r=>S.jad[jadIdx(r)]||null;

 const tb=(head,rows)=>`<div class="d2-table-scroll"><table class="d2-table"><thead><tr>${head}</tr></thead><tbody>${rows||'<tr><td colspan="8" class="d2-empty-cell">Belum ada data untuk ditampilkan.</td></tr>'}</tbody></table></div>`;

 const peakLabel=bulanPuncak.nilai?bulanPuncak.bulan:'—';

function readFile(f){

  const old=new Map(S.rows.map(r=>[r.nop,r])),out=[];
  const tr=aoa.slice(hi+1).find(r=>nz(r[0]).includes('total')),ft=tr?+String(tr[c.pokok]).replace(/[^0-9]/g,''):0;
  for(const r of aoa.slice(hi+1)){
   const nop=String(r[c.nop]??'').replace(/[^0-9]/g,'')||String(r[c.nop]??'').trim(),nama=String(r[c.nama]??'').trim();

   if(o.ed){nr.nama=o.nama;nr.wp=o.wp;nr.op=o.op;nr.cat=o.cat;nr.lama=o.lama;nr.ed=1}out.push(nr);
  }
  const seen=new Set(out.map(r=>r.nop));S.rows.forEach(o=>{if(o.add&&!seen.has(o.nop))out.push(o)});
  if(!out.length)return msg('Tidak ada baris data yang terbaca.',1);

 }catch(err){msg('Gagal membaca file: '+err.message,1)}};

 <div class="row" style="align-items:start"><div><label>Dusun</label><input list="dsl" value="${esc(m.d)}" onchange="setPm(${i},'d',this.value)"></div><div id="rw${i}">${rtInner(i)}</div></div>
 <div class="row" style="align-items:center"><span class="mu" style="flex:1"><b id="pc${i}">0</b> NOP</span><div style="flex:none;min-width:0"><button class="g sm" onclick="daftarPem(${i})">Cetak daftar</button> <button class="g sm dg" onclick="delPm(${i})">Hapus</button></div></div></div>`).join('')}
 <p id="pun" class="mu"></p><button class="b" onclick="addPm()">+ Tambah wilayah pemungut</button> ${S.pm.some(m=>m.n)?'<button class="g" onclick="daftarPem()">Cetak daftar semua pemungut</button>':''}`}
function updPm(){S.pm.forEach((m,i)=>{const e=$('#pc'+i);if(e)e.textContent=S.rows.filter(r=>pemIdx(r)===i).length});const u=$('#pun');if(u&&S.rows.length)u.textContent=S.rows.filter(r=>pemIdx(r)<0).length+' NOP belum punya pemungut (suratnya tetap tercetak tanpa nama pemungut).'}
function setPm(i,f,v){S.pm[i][f]=v.trim();save();if(f==='d')rtRefresh(i);updPm()}
function cmpRt(a){const o=[];for(let i=0;i<a.length;){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;o.push(j>i+1?a[i]+'-'+a[j]:a.slice(i,j+1).join(', '));i=j+1}return o.join(', ')}
const rtSel=m=>parseRt(m.rt).map(Number).sort((a,b)=>a-b);
const rtLabel=m=>{const s=rtSel(m);return s.length?'RT '+cmpRt(s):'Semua RT'};
function rtOpts(m){const ks=kw(m.d),s=new Set();if(ks.length)S.rows.forEach(r=>{if(ks.some(k=>dsnName(r).includes(k))){const t=rtOf(r);if(t)s.add(+t)}});rtSel(m).forEach(x=>s.add(x));return[...s].sort((a,b)=>a-b)}
function rtInner(i){const m=S.pm[i],sel=rtSel(m),o=rtOpts(m);
 return `<label>RT</label><details class="dd" id="rd${i}"><summary>${esc(rtLabel(m))}</summary><div class="ddp"><label class="ck"><input type="checkbox" class="rta" ${sel.length?'':'checked'} onchange="rtAll(${i})"> <b>Semua RT</b></label>${o.length?`<div class="rtg">${o.map(n=>`<label class="ck"><input type="checkbox" value="${n}" ${sel.includes(n)?'checked':''} onchange="rtPick(${i})"> RT ${n}</label>`).join('')}</div>`:'<p class="mu" style="margin:6px 0 0">Isi dusun dulu untuk melihat daftar RT.</p>'}</div></details>`}
function rtRefresh(i){const e=$('#rw'+i);if(e)e.innerHTML=rtInner(i)}
function rtPick(i){const d=$('#rd'+i),v=[...d.querySelectorAll('.rtg input:checked')].map(x=>+x.value).sort((a,b)=>a-b);S.pm[i].rt=v.join(',');save();d.querySelector('.rta').checked=!v.length;d.querySelector('summary').textContent=rtLabel(S.pm[i]);updPm()}
function rtAll(i){const d=$('#rd'+i);d.querySelectorAll('.rtg input').forEach(x=>x.checked=false);d.querySelector('.rta').checked=true;S.pm[i].rt='';save();d.querySelector('summary').textContent=rtLabel(S.pm[i]);updPm()}
function addPm(){S.pm.push({n:'',hp:'',d:'',rt:''});save();rAt()}
function delPm(i){if(confirm('Hapus baris pemungut ini?')){S.pm.splice(i,1);save();rAt()}}
function updCnt(){S.jad.forEach((j,i)=>{const e=$('#jc'+i);if(e)e.textContent=S.rows.filter(r=>jadIdx(r)===i).length});const u=$('#jun');if(u&&S.rows.length)u.textContent=S.rows.filter(r=>jadIdx(r)===999).length+' NOP belum masuk jadwal manapun (suratnya tetap tercetak tanpa jadwal).'}
function setJ(i,f,v){S.jad[i][f]=v.trim();save();updCnt()}
function addJ(){S.jad.push({n:'',kw:'',rw:'',t:'',j:'08.00 WIB s.d. selesai',p:''});save();rAt()}

/* ---------- login & akses ---------- */
const pinOk=p=>/^\d{4,8}$/.test(p);
async function hp(pin){const s=S.salt+'|'+pin;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'x'+h.toString(16)}}
const sessSet=()=>{try{sessionStorage.setItem('pbbU',JSON.stringify(U))}catch(e){}};
const sessDel=()=>{try{sessionStorage.removeItem('pbbU')}catch(e){}};
function validU(u){return !!u&&((u.role==='admin'&&!!S.adm&&!S.pkg)||(u.role==='pem'&&(S.pkg?S.pkg.n===u.n:!!S.pin[u.n])))}
function hdrOut(){$('#out').style.display=U&&(S.adm||S.pkg)?'':'none'}
function boot(){
 if(!S.adm&&!S.pkg){if(CLOUD_URL&&!CLD.fresh&&!S.rows.length)return rCloudStart();U={role:'admin'};hdrOut();return go('rk')}
 if(!validU(U)){U=null;try{const u=JSON.parse(sessionStorage.getItem('pbbU')||'null');if(validU(u))U=u}catch(e){}}
 if(!U)return rLogin();
 hdrOut();go(isP()||S.rows.length?'rk':'dt');if(CLOUD_URL)setTimeout(()=>{CLD.stop=0;cloudSync()},300);
}
let fails=0,until=0;
function rLogin(){
 U=null;hdrOut();$('#nav').innerHTML='';$('#sub').textContent='Masuk untuk melanjutkan';$('#pgv').textContent='';
 const names=S.pkg?[S.pkg.n]:pemList().filter(n=>S.pin[n]);
 $('#app').innerHTML=`<div class="card" style="max-width:380px;margin:24px auto"><h2>Masuk</h2>
 <div class="f" style="margin-bottom:10px"><label>Masuk sebagai</label><select id="lu">${S.pkg?'':'<option value="">Admin</option>'}${names.map(n=>`<option value="${esc(n)}">Pemungut: ${esc(n)}</option>`).join('')}</select></div>
 <div><label>PIN</label><input id="lp" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>
 <div class="msg" id="lm"></div>
 <p style="margin:14px 0 0"><button class="b" style="width:100%" onclick="doLogin()">Masuk</button></p>
 ${S.pkg?`<p class="mu" style="margin:18px 0 6px">Ada paket data baru dari admin? Impor di sini (setoran yang belum dikirim akan hilang):</p>${CLOUD_URL?'<p style="margin:0 0 10px"><button class="g" onclick="cloudLoadPaket()">Muat paket terbaru dari cloud</button></p>':''}<input type="file" accept=".json" onchange="this.files[0]&&impPaket(this.files[0])">`
 :`<p class="mu" style="margin:16px 0 0"><a href="#" onclick="lupa();return false" style="color:var(--mu)">Lupa PIN admin?</a></p>`}</div>`;
 $('#lp').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('#lp').focus();
}
async function doLogin(){
 const m=$('#lm'),show=t=>{m.style.display='block';m.className='msg er';m.textContent=t};
 if(Date.now()<until)return show('Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil((until-Date.now())/1000)+' detik.');
 const u=$('#lu').value,p=$('#lp').value.trim(),want=u?(S.pkg?S.pkg.hash:S.pin[u]):S.adm;
 if(p&&await hp(p)===want){fails=0;U=u?{role:'pem',n:u}:{role:'admin'};sessSet();return boot()}
 if(++fails>=5){fails=0;until=Date.now()+30000;return show('Terlalu banyak percobaan. Tunggu 30 detik.')}
 show('PIN salah.');
}
function logout(){sessDel();rLogin()}
function lupa(){if(!confirm('Ini menghapus SEMUA data di perangkat ini, termasuk PIN, supaya bisa mulai dari awal. Pulihkan dari berkas cadangan sesudahnya. Lanjutkan?'))return;try{localStorage.removeItem('pbbdesa')}catch(e){}sessDel();location.reload()}

/* ---------- berkas paket, setoran, cadangan ---------- */
function dl(o,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function rdJSON(f,cb){const rd=new FileReader();rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(e){return alert('Berkas tidak valid.')}cb(o)};rd.readAsText(f)}
const slug=s=>String(s).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
function paket(n){
 if(!S.pin[n])return alert('Atur PIN untuk '+n+' dulu.');
 const rows=S.rows.filter(r=>pemOf(r)===n);if(!rows.length)return alert('Belum ada NOP untuk pemungut ini.');
 const pm=S.pm.filter(m=>m.n===n);
 const meta={};['desa','kec','kab','kades','tempat','tahun','jt','bt','nomor','nomorT','kop'].forEach(k=>meta[k]=S[k]);
 dl({type:'paket',v:1,n,hash:S.pin[n],salt:S.salt,meta,jad:S.jad,pm,rows},'paket-'+slug(n)+'-'+S.tahun+'.json');
}
function impPaket(f){rdJSON(f,o=>{
 if(o.type!=='paket'||!Array.isArray(o.rows)||!o.n||!o.hash)return alert('Berkas ini bukan paket pemungut.');
 if(!S.pkg&&(S.adm||S.rows.length))return alert('Perangkat ini berisi data admin. Paket pemungut hanya bisa diimpor di perangkat pemungut.');
 if(S.pkg&&!confirm('Paket lama di perangkat ini akan diganti. Lanjutkan?'))return;
 S=Object.assign({rows:o.rows,pem:{},pm:o.pm||[],jad:o.jad||[],pin:{},salt:o.salt,pkg:{n:o.n,hash:o.hash}},o.meta);
 save();U=null;sessDel();boot()})}
function setor(){
 const upd=VR().filter(r=>r.lunas||r.serah).map(r=>({nop:r.nop,lunas:r.lunas,serah:r.serah}));
 if(!upd.length)return alert('Belum ada pembayaran yang dicatat.');
 dl({type:'setor',v:1,pem:U.n,tahun:S.tahun,at:new Date().toISOString(),upd},'setoran-'+slug(U.n)+'-'+today()+'.json');
}
function impSetor(f){rdJSON(f,o=>{
 if(o.type!=='setor'||!Array.isArray(o.upd))return alert('Berkas ini bukan setoran pemungut.');
 if(+o.tahun!==+S.tahun)return alert('Tahun pajak berkas ('+o.tahun+') berbeda dengan data ('+S.tahun+').');
 const m=new Map(S.rows.map(r=>[r.nop,r]));let a=0,b=0,x=0;
 o.upd.forEach(u=>{const r=m.get(u.nop);if(!r||pemOf(r)!==o.pem){x++;return}
  if(u.lunas&&!r.lunas){r.lunas=u.lunas;a++}if(u.serah&&!r.serah&&r.lunas){r.serah=u.serah;b++}});
 save();hdr();alert('Setoran '+o.pem+': '+a+' NOP lunas dan '+b+' SPPT diserahkan ditambahkan'+(x?'; '+x+' baris dilewati (bukan blok pemungut ini).':'.'));rBy()})}
function cadang(){dl({type:'cadangan',v:1,S},'cadangan-pbb-'+S.tahun+'-'+today()+'.json')}
function pulih(f){rdJSON(f,o=>{
 if(o.type!=='cadangan'||!o.S||!Array.isArray(o.S.rows))return alert('Berkas ini bukan cadangan modul.');
 if(!confirm('Data di perangkat ini akan diganti dengan isi cadangan. Lanjutkan?'))return;
 S=o.S;S.pem=S.pem||{};S.jad=S.jad||[];S.pin=S.pin||{};S.pm=S.pm||[];if(!S.salt)S.salt=Math.random().toString(36).slice(2);
 save();U=null;sessDel();boot()})}

var CLOUD_URL=(typeof CLOUD_URL!=='undefined'&&CLOUD_URL)||'',CLOUD_KEY=(typeof CLOUD_KEY!=='undefined'&&CLOUD_KEY)||'';
var CLD={busy:0,tmr:0,stop:0,fresh:0,salt:'',lastU:0};
try{CLD.lastU=+(localStorage.getItem('pbbU2')||0)}catch(e){}
const cloudSig=r=>(r.lunas||'')+'|'+(r.serah||'');
const cloudPend=()=>S.rows.filter(r=>cloudSig(r)!==(r.sg||'|')).length;
function cloudRaw(){pmc.clear();try{localStorage.setItem('pbbdesa',JSON.stringify(S))}catch(e){}}
function cloudKick(){try{if(!CLOUD_URL||!U||!cloudPend())return;clearTimeout(CLD.tmr);CLD.tmr=setTimeout(()=>cloudSync(),1500)}catch(e){}}
function cloudSay(t,bad){if(!CLOUD_URL)return;let e=document.getElementById('cloudst');
 if(!e){e=document.createElement('div');e.id='cloudst';e.title='Ketuk untuk sinkron sekarang';
  e.style.cssText='position:fixed;right:10px;bottom:10px;z-index:50;background:#fff;border:1px solid #cbd5e1;border-radius:20px;padding:5px 12px;font:12px system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer;max-width:75vw';
  e.onclick=()=>{CLD.stop=0;cloudSync()};document.body.appendChild(e)}
 e.style.display=U?'':'none';e.style.color=bad?'#b91c1c':'#334155';e.textContent='\u2601 '+t}
const cloudAdminH=()=>{try{return localStorage.getItem('pbbCP')||S.adm}catch(e){return S.adm}};
function cloudAuth(){if(!U)return null;if(U.role==='admin')return S.adm?{role:'admin',h:cloudAdminH()}:null;
 return{role:'pem',n:U.n,h:S.pkg?S.pkg.hash:S.pin[U.n]}}
async function cloudPost(a,d){
 const r=await fetch(CLOUD_URL,{method:'POST',body:JSON.stringify(Object.assign({k:CLOUD_KEY,a},d))});
 const j=await r.json();if(!j.ok){const e=new Error(j.e||'Gagal');e.code=j.c;throw e}return j}
async function cloudSync(au){
 if(!CLOUD_URL||CLD.busy||CLD.stop)return;
 au=au&&au.role?au:cloudAuth();if(!au)return;
 if(!navigator.onLine){cloudSay('Offline \u2013 '+cloudPend()+' menunggu dikirim',1);return}
 CLD.busy=1;
 try{
  cloudSay('Menyinkronkan\u2026');
  const P=S.rows.filter(r=>cloudSig(r)!==(r.sg||'|'));
  if(P.length){
   const t=CLD.lastT=Math.max(Date.now(),(CLD.lastT||0)+1),B=P.slice(0,400).map(r=>({r,sg:cloudSig(r),it:{nop:String(r.nop),lunas:r.lunas||'',serah:r.serah||'',t}}));
   await cloudPost('pay',{au,items:B.map(x=>x.it)});
   B.forEach(x=>{x.r.sg=x.sg;x.r.ct=t});cloudRaw();
  }
  const j=await cloudPost('pull',{au,since:Math.max(0,CLD.lastU-3000)});
  const m=new Map(S.rows.map(r=>[String(r.nop),r]));let ch=0;
  j.items.forEach(x=>{const r=m.get(String(x.nop));
   if(!r||cloudSig(r)!==(r.sg||'|')||x.t<=(r.ct||0))return;
   r.lunas=x.lunas;r.serah=x.serah;r.ct=x.t;r.sg=cloudSig(r);ch++});
  CLD.lastU=j.u;try{localStorage.setItem('pbbU2',String(j.u))}catch(e){}
  if(ch){cloudRaw();hdr();if(U){if(cur==='by'&&document.getElementById('ls'))ls();else if(cur==='rk')go('rk')}}
  const rest=cloudPend();
  cloudSay(rest?rest+' menunggu dikirim':'Tersinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
  if(rest)setTimeout(()=>cloudSync(),300);
 }catch(e){
  if(e.code==='auth')CLD.stop=1;
  cloudSay(/fetch|network/i.test(e.message)?'Offline \u2013 '+cloudPend()+' menunggu dikirim':e.message,1);
 }finally{CLD.busy=0}
}

function mkPaket(n){
 if(!S.pin[n])return null;const rows=S.rows.filter(r=>pemOf(r)===n);if(!rows.length)return null;
 const meta={};['desa','kec','kab','kades','tempat','tahun','jt','bt','nomor','nomorT','kop'].forEach(k=>meta[k]=S[k]);
 return{type:'paket',v:1,n,hash:S.pin[n],salt:S.salt,meta,jad:S.jad,pm:S.pm.filter(m=>m.n===n),rows:rows.map(r=>Object.assign({},r,{sg:cloudSig(r)}))}}
function applyPaket(o){
 S=Object.assign({rows:o.rows,pem:{},pm:o.pm||[],jad:o.jad||[],pin:{},salt:o.salt,pkg:{n:o.n,hash:o.hash}},o.meta);
 CLD.lastU=0;try{localStorage.setItem('pbbU2','0')}catch(e){}save()}
function cloudHtml(){if(!CLOUD_URL)return'';
 return`<h2 style="margin:20px 0 8px">Sinkron cloud (Google Sheets)</h2>
 <p class="mu" style="margin-top:0">Pembayaran yang dicatat admin maupun pemungut otomatis tersimpan ke Google Sheets dan muncul di semua perangkat. Setelah mengubah data NOP, wilayah pemungut, jadwal, atau PIN, tekan tombol ini supaya pemungut mendapat data terbaru.</p>
 <p><button class="b" onclick="cloudPushAll()">Unggah data &amp; paket pemungut ke cloud</button> <span id="cpm" class="mu"></span></p>`}
async function cloudPushAll(){
 const m=document.getElementById('cpm'),say=t=>{if(m)m.textContent=t};
 if(!S.adm)return alert('Aktifkan PIN admin dulu (bagian Akun & akses di atas).');
 if(isP()||S.pkg)return alert('Hanya admin yang bisa mengunggah.');
 say('Mengunggah\u2026');
 try{
  CLD.stop=0;await cloudSync();CLD.stop=0;
  const snap=JSON.parse(JSON.stringify(S));snap.rows.forEach(r=>{r.sg=cloudSig(r)});delete snap.pkg;
  const P={};pemList().forEach(n=>{const o=mkPaket(n);if(o)P[n]=JSON.stringify(o)});
  const view=S.rows.map(r=>[String(r.nop),r.nama||'',r.pokok||0,fOp(r.op),pemOf(r)||'']);
  await cloudPost('push',{au:{role:'admin',h:cloudAdminH()},S:JSON.stringify(snap),A:{adm:S.adm,pin:S.pin,salt:S.salt},P,view});
  try{localStorage.setItem('pbbCP',S.adm)}catch(e){}
  CLD.stop=0;await cloudSync();
  say('Berhasil diunggah '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' ('+Object.keys(P).length+' paket pemungut)');
 }catch(e){say('Gagal: '+e.message)}
}

 show('Memuat data\u2026');
 try{
  S.salt=CLD.salt;const h=await hp(p);
  if(u){const j=await cloudPost('paket',{au:{role:'pem',n:u,h}});applyPaket(JSON.parse(j.p));U={role:'pem',n:u}}
  else{const j=await cloudPost('full',{au:{role:'admin',h}});S=JSON.parse(j.S);
   S.pem=S.pem||{};S.jad=S.jad||[];S.pin=S.pin||{};S.pm=S.pm||[];S.rows=S.rows||[];delete S.pkg;
   CLD.lastU=0;try{localStorage.setItem('pbbU2','0');localStorage.setItem('pbbCP',S.adm)}catch(e){}save();U={role:'admin'}}
  sessSet();boot();
 }catch(e){show(/fetch|network/i.test(e.message)?'Tidak ada koneksi internet.':e.message)}}
